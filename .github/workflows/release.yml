name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
            Directory.Packages.props
            NuGet.Config

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DigYourWindows.slnx

      - name: Build
        run: dotnet build DigYourWindows.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DigYourWindows.slnx -c Release --no-restore

      - name: Publish & Package Release
        run: |
          ./scripts/publish.ps1 -Configuration Release -Runtime win-x64 -Version ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DigYourWindows ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
          files: |
            artifacts/release/DigYourWindows_*_win-x64_portable.zip
            artifacts/release/DigYourWindows_*_win-x64_standalone.zip
            artifacts/release/SHA256SUMS.txt
